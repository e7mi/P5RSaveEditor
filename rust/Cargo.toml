[package]
name = "p5r-save-editor"
version = "1.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", default-features = false }
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
flate2 = "1"
rand = "0.8"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
sha2 = "0.10"
chrono = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "libloaderapi"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
